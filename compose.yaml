# Запуск бота в Docker. Лежит в `<папка деплоя>/src/`; рядом — `.env` (секреты) и `workspace/` (данные),
# они переживают обновления. Порты наружу не публикуются: бот сам ходит в Telegram (long polling).
name: uclipper

services:
  bot:
    build: .
    image: local/uclipper:latest
    container_name: uclipper
    restart: unless-stopped
    init: true
    env_file: ../.env
    volumes:
      - ../workspace:/app/workspace
    # Рендер видео прожорлив, а сервер общий: бот получает не больше двух ядер и гигабайта памяти, а пока
    # соседям нужен процессор, ему достаётся лишь доля по низкому весу (cpu_shares). Свободные ядра бот
    # забирает целиком. Потоков у ffmpeg ровно столько, сколько ядер здесь разрешено (читается из cgroup).
    cpus: 2.0
    cpu_shares: 256
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
